name: Deploy LRC API

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration even if dump unchanged"
        required: false
        default: "false"

env:
  DUMP_LIST_URL: https://lrclib-db-dumps.bu3nnyut4y9jfkdg.workers.dev/
  DUMP_BASE_URL: https://db-dumps.lrclib.net/
  GZIP_PATH: /tmp/lrclib-db.sqlite3.gz
  MANIFEST_PATH: /tmp/manifest.json
  CHUNK_DIR: /tmp/rooms
  RELEASE_TAG: rooms-latest

permissions:
  contents: write

jobs:
  detect:
    name: Detect dump update
    runs-on: ubuntu-latest
    outputs:
      dump_key: ${{ steps.detect.outputs.dump_key }}
      dump_url: ${{ steps.detect.outputs.dump_url }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Query dump list
        id: detect
        run: |
          set -euo pipefail
          LIST=$(curl -sS "$DUMP_LIST_URL")
          KEY=$(echo "$LIST" | python3 << 'PYEOF'
          import json, sys
          objs = json.load(sys.stdin)['objects']
          if not objs:
              raise SystemExit('no dump objects')
          latest = max(objs, key=lambda o: o.get('uploaded', ''))
          print(latest['key'])
          PYEOF
          )
          URL="${DUMP_BASE_URL}${KEY}"
          echo "dump_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "dump_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest dump: $KEY"
          PREV=""
          if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json" -o /tmp/prev_manifest.json 2>/dev/null; then
            if python3 -c "import json; json.load(open('/tmp/prev_manifest.json'))" 2>/dev/null; then
              PREV=$(python3 -c "import json; print(json.load(open('/tmp/prev_manifest.json')).get('dump_key',''))" 2>/dev/null || true)
            fi
          fi
          echo "Previous dump: ${PREV:-none}"
          FORCE="${{ github.event.inputs.force }}"
          if [ -z "${PREV:-}" ] || [ "$KEY" != "$PREV" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: Generate rooms and upload to Releases
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Aggressive disk cleanup
        run: |
          set -euo pipefail
          # Remove every toolchain this pipeline does not need.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/node || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/edge_driver || true
          sudo rm -rf /usr/local/share/gecko_driver || true
          sudo rm -rf /var/lib/mysql || true
          sudo rm -rf /var/lib/postgresql || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /imagegeneration || true
          sudo apt-get purge -y --auto-remove azure-cli google-chrome-stable firefox microsoft-edge-stable 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /tmp

      - name: Verify disk space
        run: df -h /tmp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build generator
        run: |
          cd rust-parser
          cargo build --release --features zlib-ng

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir rapidgzip orjson zstandard

      - name: Download DB dump
        run: |
          aria2c -x 16 -s 16 -d /tmp -o lrclib-db.sqlite3.gz "${{ needs.detect.outputs.dump_url }}"
          df -h /tmp

      - name: Generate room files (Rust)
        run: |
          ./rust-parser/target/release/lrc-room-generator "$GZIP_PATH" "$MANIFEST_PATH" "src/config.ts" "$CHUNK_DIR" "${{ needs.detect.outputs.dump_key }}"
          df -h /tmp

      - name: Upload to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 - "$CHUNK_DIR" "$MANIFEST_PATH" << 'EOF'
          import json, os, subprocess, sys
          chunk_dir = sys.argv[1]
          manifest_path = sys.argv[2]
          manifest = json.load(open(manifest_path))
          rooms_per_release = manifest["rooms_per_release"]
          release_tags = manifest["release_tags"]
          files = manifest["files"]

          room_files = [f for f in files if f["name"].startswith("room-")]
          index_files = [f for f in files if f["name"].startswith("index-")]

          groups = {}
          for f in room_files:
              rid = int(f["name"].split("-")[1].split(".")[0])
              ri = rid // rooms_per_release
              groups.setdefault(ri, []).append(f["name"])

          repo = os.environ["GITHUB_REPOSITORY"]

          def create_release(tag, title, notes):
              subprocess.run(
                  ["gh", "release", "delete", tag, "--yes", "--cleanup-tag"],
                  check=False)
              subprocess.run(
                  ["gh", "release", "create", tag, "--repo", repo,
                   "--title", title, "--notes", notes, "--prerelease", "--draft"],
                  check=True)

          def upload(tag, asset_paths):
              if not asset_paths:
                  return
              cmd = ["gh", "release", "upload", tag,
                     "--repo", repo, "--clobber"] + asset_paths
              subprocess.run(cmd, cwd=chunk_dir, check=True)

          def publish(tag):
              subprocess.run(
                  ["gh", "release", "edit", tag, "--draft=false", "--repo", repo],
                  check=True)

          for ri in sorted(groups):
              tag = release_tags[ri]
              notes = f"Room group {ri} for {manifest['dump_key']}"
              print(f"Release {tag}: {len(groups[ri])} rooms", flush=True)
              create_release(tag, f"Room data group {ri} (auto)", notes)
              upload(tag, groups[ri])
              publish(tag)

          # index files go to the last release tag
          last_tag = release_tags[-1]
          print(f"Uploading {len(index_files)} index files to {last_tag}", flush=True)
          upload(last_tag, [f["name"] for f in index_files])
          EOF

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Room manifest (auto)" \
            --notes "Manifest for ${{ needs.detect.outputs.dump_key }}" \
            --prerelease --draft
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$MANIFEST_PATH" "src/config.ts"
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

          echo "All release groups published"

  deploy:
    name: Deploy to PartyKit
    runs-on: ubuntu-latest
    needs: [detect, generate]
    if: |
      always() &&
      (needs.generate.result == 'success' || needs.detect.outputs.changed == 'false')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node dependencies
        run: bun install

      - name: Download config.ts from release
        run: |
          if ! gh release download "$RELEASE_TAG" --pattern "config.ts" --dir src --clobber 2>/dev/null; then
            echo "::warning::Release $RELEASE_TAG not found. Using checked-in config.ts."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to PartyKit
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
        run: |
          bunx partykit deploy