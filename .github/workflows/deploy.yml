name: Deploy LRC API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Force regenerate chunks (skip Releases download)"
        required: false
        default: "false"

env:
  DUMP_URL: https://db-dumps.lrclib.net/lrclib-db-dump-20260807T082319Z.sqlite3.gz
  GZIP_PATH: /tmp/lrclib-db.sqlite3.gz
  MANIFEST_PATH: /tmp/manifest.json
  CHUNK_DIR: /tmp/chunks
  MOUNT_POINT: /tmp/fuse_data
  PUBLIC_DIR: public/data
  RELEASE_TAG: chunks-latest

jobs:
  generate:
    name: Generate chunks and upload to Releases
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[regenerate]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate == 'true')
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir rapidgzip apsw mfusepy orjson zstandard

      - name: Install Node dependencies
        run: bun install

      - name: Download DB dump
        run: |
          aria2c -x 16 -s 16 -d /tmp -o lrclib-db.sqlite3.gz "$DUMP_URL"

      - name: Generate manifest, chunk files, and index files
        run: |
          python scripts/generate_manifest.py "$GZIP_PATH" "$MANIFEST_PATH" "src/config.ts" "$CHUNK_DIR"

      - name: Clean up gzip to free disk
        run: |
          rm -f "$GZIP_PATH"
          df -h /tmp

      - name: Pack chunks into 2GB split archives
        run: |
          cd "$CHUNK_DIR"
          tar cf - . | split -b 1900MB - chunk_archive_
          echo "Archive parts: $(ls chunk_archive_* | wc -l)"

      - name: Delete existing release
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and upload archives
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chunk archives (auto)" \
            --notes "Auto-generated chunk archives" \
            --prerelease \
            "$CHUNK_DIR"/chunk_archive_*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload config.ts and manifest as release assets
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" src/config.ts "$MANIFEST_PATH" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger deploy job
        if: success() && github.event_name == 'push'
        run: |
          sleep 5
          gh workflow run "$GITHUB_WORKFLOW" --ref "$GITHUB_REF"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to PartyKit (from Releases)
    runs-on: ubuntu-latest
    if: |
      !((github.event_name == 'push' && contains(github.event.head_commit.message, '[regenerate]')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate == 'true'))
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node dependencies
        run: bun install

      - name: Download config.ts from release
        run: |
          if ! gh release download "$RELEASE_TAG" --pattern "config.ts" --dir src --clobber 2>/dev/null; then
            echo "::warning::Release $RELEASE_TAG not found. Using checked-in config.ts. Run with [regenerate] to create it."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download manifest from release
        run: |
          mkdir -p /tmp
          if ! gh release download "$RELEASE_TAG" --pattern "manifest.json" --dir /tmp --clobber 2>/dev/null; then
            echo "::warning::manifest.json not found in release. Deploy may use stale data."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FUSE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse-dev fuse 2>/dev/null || true
          sudo modprobe fuse 2>/dev/null || true
          sudo chmod 666 /dev/fuse 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir mfusepy orjson zstandard

      - name: Download chunk archives from release
        run: |
          mkdir -p "$CHUNK_DIR"
          if ! gh release download "$RELEASE_TAG" --pattern "chunk_archive_*" --dir "$CHUNK_DIR" --clobber 2>/dev/null; then
            echo "::error::No chunk archives found in release $RELEASE_TAG. Trigger a workflow with [regenerate] in commit message first."
            exit 1
          fi
          cd "$CHUNK_DIR"
          cat chunk_archive_* | tar xf -
          rm -f chunk_archive_*
          echo "Chunk files: $(ls | wc -l)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare public directory
        run: |
          mkdir -p public
          rm -rf public/data

      - name: Mount FUSE filesystem
        run: |
          mkdir -p "$MOUNT_POINT"
          python scripts/fuse_vfs.py "$MANIFEST_PATH" "$CHUNK_DIR" "$MOUNT_POINT" &
          FUSE_PID=$!
          echo "FUSE_PID=$FUSE_PID" >> $GITHUB_ENV
          sleep 10
          FILE_COUNT=$(ls "$MOUNT_POINT" 2>/dev/null | wc -l)
          echo "FUSE file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: FUSE mount failed, no files visible"
            kill $FUSE_PID 2>/dev/null || true
            exit 1
          fi
          ln -s "$MOUNT_POINT" public/data

      - name: Deploy to PartyKit
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
        run: |
          bunx partykit deploy

      - name: Cleanup
        if: always()
        run: |
          if [ -n "$FUSE_PID" ]; then
            fusermount -u "$MOUNT_POINT" 2>/dev/null || true
            kill $FUSE_PID 2>/dev/null || true
          fi
          rm -f "$MANIFEST_PATH"
          rm -rf "$PUBLIC_DIR" "$CHUNK_DIR"
