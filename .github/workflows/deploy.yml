name: Deploy LRC API

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration even if dump unchanged"
        required: false
        default: "false"

env:
  DUMP_LIST_URL: https://lrclib-db-dumps.bu3nnyut4y9jfkdg.workers.dev/
  DUMP_BASE_URL: https://db-dumps.lrclib.net/
  GZIP_PATH: /tmp/lrclib-db.sqlite3.gz
  MANIFEST_PATH: /tmp/manifest.json
  CHUNK_DIR: /tmp/rooms
  RELEASE_TAG: rooms-latest

permissions:
  contents: write

concurrency:
  group: deploy-lrc-api
  cancel-in-progress: false

jobs:
  detect:
    name: Detect dump update
    runs-on: ubuntu-latest
    outputs:
      dump_key: ${{ steps.detect.outputs.dump_key }}
      dump_url: ${{ steps.detect.outputs.dump_url }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Query dump list
        id: detect
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -w "\nHTTP:%{http_code}" "$DUMP_LIST_URL" || echo "CURL_FAILED")
          HTTP_CODE=$(printf '%s' "$RESPONSE" | grep -o 'HTTP:[0-9]*$' | cut -d: -f2)
          LIST=$(printf '%s' "$RESPONSE" | grep -v 'HTTP:[0-9]*$' || true)
          echo "HTTP status: ${HTTP_CODE:-none}"
          if [ "${HTTP_CODE:-}" != "200" ] || [ -z "${LIST:-}" ]; then
            echo "::error::Failed to fetch dump list from $DUMP_LIST_URL (status: ${HTTP_CODE:-none})"
            exit 1
          fi
          KEY=$(printf '%s' "$LIST" | jq -r '.objects | map(select(.key != null)) | sort_by(.uploaded) | last | .key')
          if [ -z "${KEY:-}" ] || [ "$KEY" = "null" ]; then
            echo "::error::No dump objects found"
            exit 1
          fi
          URL="${DUMP_BASE_URL}${KEY}"
          echo "dump_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "dump_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest dump: $KEY"
          PREV=""
          if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json" -o /tmp/prev_manifest.json 2>/dev/null; then
            PREV=$(jq -r '.dump_key // empty' /tmp/prev_manifest.json 2>/dev/null || true)
          fi
          echo "Previous dump: ${PREV:-none}"
          FORCE="${{ github.event.inputs.force }}"
          if [ -z "${PREV:-}" ] || [ "$KEY" != "$PREV" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          URL="${DUMP_BASE_URL}${KEY}"
          echo "dump_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "dump_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest dump: $KEY"
          PREV=""
          if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json" -o /tmp/prev_manifest.json 2>/dev/null; then
            PREV=$(jq -r '.dump_key // empty' /tmp/prev_manifest.json 2>/dev/null || true)
          fi
          echo "Previous dump: ${PREV:-none}"
          FORCE="${{ github.event.inputs.force }}"
          if [ -z "${PREV:-}" ] || [ "$KEY" != "$PREV" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: Generate rooms and upload to Releases
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Aggressive disk cleanup
        run: |
          set -euo pipefail
          # Remove every toolchain this pipeline does not need.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/node || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/local/share/edge_driver || true
          sudo rm -rf /usr/local/share/gecko_driver || true
          sudo rm -rf /var/lib/mysql || true
          sudo rm -rf /var/lib/postgresql || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /imagegeneration || true
          sudo rm -rf /usr/local/python || true
          sudo rm -rf /opt/hostedtoolcache/Python || true
          sudo rm -rf /usr/lib/python3 || true
          sudo rm -rf /usr/lib/python3.12 || true
          sudo rm -rf /usr/lib/pypy3 || true
          sudo apt-get purge -y --auto-remove azure-cli google-chrome-stable firefox microsoft-edge-stable 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /tmp

      - name: Verify disk space
        run: df -h /tmp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build generator
        run: |
          cd rust-parser
          cargo build --release --no-default-features --features zlib-ng

      - name: Download DB dump
        run: |
          aria2c -x 16 -s 16 -d /tmp -o lrclib-db.sqlite3.gz "${{ needs.detect.outputs.dump_url }}"
          df -h /tmp

      - name: Generate room files (Rust)
        run: |
          ./rust-parser/target/release/lrc-room-generator "$GZIP_PATH" "$MANIFEST_PATH" "src/config.ts" "$CHUNK_DIR" "${{ needs.detect.outputs.dump_key }}"
          df -h /tmp

      - name: Upload to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Retry a gh command on rate-limit/5xx with exponential backoff.
          gh_retry() {
            local attempt=0
            local max_attempts=6
            while true; do
              if "$@" 2>/tmp/gh_err.log; then
                return 0
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max_attempts" ]; then
                cat /tmp/gh_err.log >&2
                return 1
              fi
              local wait=$((2 ** attempt * 15))
              echo "gh failed (attempt $attempt), retrying in ${wait}s" >&2
              sleep "$wait"
            done
          }

          ROOMS_PER_RELEASE=$(jq -r '.rooms_per_release' "$MANIFEST_PATH")
          DUMP_KEY=$(jq -r '.dump_key' "$MANIFEST_PATH")
          TAGS=$(jq -r '.release_tags[]' "$MANIFEST_PATH")

          cd "$CHUNK_DIR"

          # Group room files by release index (room id / rooms_per_release)
          # and upload each group to its own release tag.
          GROUP=-1
          COUNT=0
          GROUP_FILES=""
          for f in $(ls room-*.json.gz | sort); do
            RID=$(( 10#$(printf '%s' "$f" | tr -dc '0-9') ))
            RI=$((RID / ROOMS_PER_RELEASE))
            if [ "$RI" != "$GROUP" ]; then
              # flush previous group
              if [ -n "$GROUP_FILES" ]; then
                TAG=$(printf '%s\n' "$TAGS" | sed -n "$((GROUP + 1))p")
                echo "Release $TAG: $COUNT rooms"
                gh_retry gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
                gh_retry gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --title "Room data group $GROUP (auto)" \
                  --notes "Room group $GROUP for $DUMP_KEY" \
                  --prerelease --draft
                # Upload in chunks of 50 files with a pause between
                # chunks to stay under the uploads API rate limit.
                CHUNK_FILES=""
                CHUNK_N=0
                for gf in $GROUP_FILES; do
                  CHUNK_FILES="$CHUNK_FILES $gf"
                  CHUNK_N=$((CHUNK_N + 1))
                  if [ "$CHUNK_N" -ge 50 ]; then
                    gh_retry gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $CHUNK_FILES
                    sleep 20
                    CHUNK_FILES=""
                    CHUNK_N=0
                  fi
                done
                if [ -n "$CHUNK_FILES" ]; then
                  gh_retry gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $CHUNK_FILES
                fi
                gh_retry gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
              fi
              GROUP=$RI
              COUNT=0
              GROUP_FILES=""
            fi
            GROUP_FILES="$GROUP_FILES $f"
            COUNT=$((COUNT + 1))
          done
          if [ -n "$GROUP_FILES" ]; then
            TAG=$(printf '%s\n' "$TAGS" | sed -n "$((GROUP + 1))p")
            echo "Release $TAG: $COUNT rooms"
            gh_retry gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh_retry gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Room data group $GROUP (auto)" \
              --notes "Room group $GROUP for $DUMP_KEY" \
              --prerelease --draft
            CHUNK_FILES=""
            CHUNK_N=0
            for gf in $GROUP_FILES; do
              CHUNK_FILES="$CHUNK_FILES $gf"
              CHUNK_N=$((CHUNK_N + 1))
              if [ "$CHUNK_N" -ge 50 ]; then
                gh_retry gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $CHUNK_FILES
                sleep 20
                CHUNK_FILES=""
                CHUNK_N=0
              fi
            done
            if [ -n "$CHUNK_FILES" ]; then
              gh_retry gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $CHUNK_FILES
            fi
            gh_retry gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi

          # index files go to the last release tag
          LAST_TAG=$(printf '%s\n' "$TAGS" | tail -n 1)
          echo "Uploading index files to $LAST_TAG"
          gh_retry gh release upload "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --clobber index-*.bin

          cd "$GITHUB_WORKSPACE"

          gh_retry gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh_retry gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Room manifest (auto)" \
            --notes "Manifest for $DUMP_KEY" \
            --prerelease --draft
          gh_retry gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$MANIFEST_PATH" "src/config.ts"
          gh_retry gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

          echo "All release groups published"

  deploy:
    name: Deploy to PartyKit
    runs-on: ubuntu-latest
    needs: [detect, generate]
    if: |
      always() &&
      (needs.generate.result == 'success' || needs.detect.outputs.changed == 'false')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node dependencies
        run: bun install

      - name: Download config.ts from release
        run: |
          if ! gh release download "$RELEASE_TAG" --pattern "config.ts" --dir src --clobber 2>/dev/null; then
            echo "::warning::Release $RELEASE_TAG not found. Using checked-in config.ts."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to PartyKit
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
        run: |
          bunx partykit deploy