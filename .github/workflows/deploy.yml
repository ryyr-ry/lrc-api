name: Deploy LRC API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Force regenerate chunks (skip Releases download)"
        required: false
        default: "false"

env:
  DUMP_URL: https://db-dumps.lrclib.net/lrclib-db-dump-20260807T082319Z.sqlite3.gz
  GZIP_PATH: /tmp/lrclib-db.sqlite3.gz
  MANIFEST_PATH: /tmp/manifest.json
  CHUNK_DIR: /tmp/chunks
  MOUNT_POINT: /tmp/fuse_data
  PUBLIC_DIR: public/data
  RELEASE_TAG: chunks-latest

permissions:
  contents: write

jobs:
  generate:
    name: Generate chunks and upload to Releases
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[regenerate]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.regenerate == 'true')
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir rapidgzip orjson zstandard

      - name: Install Node dependencies
        run: bun install

      - name: Download DB dump
        run: |
          aria2c -x 16 -s 16 -d /tmp -o lrclib-db.sqlite3.gz "$DUMP_URL"

      - name: Generate manifest, chunk files, and index files
        run: |
          python scripts/generate_manifest.py "$GZIP_PATH" "$MANIFEST_PATH" "src/config.ts" "$CHUNK_DIR"

      - name: Clean up gzip to free disk
        run: |
          rm -f "$GZIP_PATH"
          df -h /tmp

      - name: Pack and upload to Releases (pipelined)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd "$CHUNK_DIR"

          python3 -c "
          import os, sys
          target = 1900 * 1024 * 1024
          group, size = [], 0
          for fn in sorted(os.listdir('.')):
              s = os.path.getsize(fn)
              if fn.startswith('part_') or fn.startswith('chunk_archive_'):
                  continue
              if size + s > target and group:
                  print(':'.join(group))
                  group, size = [], 0
              group.append(fn)
              size += s
          if group:
              print(':'.join(group))
          " > /tmp/file_groups

          NUM_GROUPS=$(wc -l < /tmp/file_groups)
          echo "$NUM_GROUPS archive groups"

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chunk archives (auto)" \
            --notes "Auto-generated chunk archives" \
            --prerelease --draft

          i=0
          while IFS= read -r group; do
              i=$((i+1))
              part=$(printf "part_%04d.tar" "$i")
              IFS=':' read -ra files <<< "$group"
              tar cf "$part" "${files[@]}"
              gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$part" --clobber
              rm -f "$part" &
              while [ "$(jobs -r | wc -l)" -ge 2 ]; do sleep 0.5; done
          done < /tmp/file_groups
          wait

          ASSET_COUNT=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "Assets uploaded: $ASSET_COUNT"

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE/src/config.ts" "$MANIFEST_PATH" --clobber

          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

          echo "Release published with $ASSET_COUNT archive parts + 2 metadata files"

  deploy:
    name: Deploy to PartyKit (from Releases)
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: oven-sh/setup-bun@v2

      - name: Install Node dependencies
        run: bun install

      - name: Download config.ts from release
        run: |
          if ! gh release download "$RELEASE_TAG" --pattern "config.ts" --dir src --clobber 2>/dev/null; then
            echo "::warning::Release $RELEASE_TAG not found. Using checked-in config.ts. Run with [regenerate] to create it."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download manifest from release
        run: |
          mkdir -p /tmp
          if ! gh release download "$RELEASE_TAG" --pattern "manifest.json" --dir /tmp --clobber 2>/dev/null; then
            echo "::warning::manifest.json not found in release. Deploy may use stale data."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir zstandard

      - name: Download chunk archives (parallel)
        run: |
          mkdir -p "$CHUNK_DIR"
          gh api repos/"$GITHUB_REPOSITORY"/releases/tags/"$RELEASE_TAG" \
            --jq '.assets[] | select(.name | test("part_")) | .browser_download_url' \
            > /tmp/urls.txt

          URL_COUNT=$(wc -l < /tmp/urls.txt)
          echo "Downloading $URL_COUNT archive parts..."

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "::error::No chunk archives found in release $RELEASE_TAG. Trigger a workflow with [regenerate] in commit message first."
            exit 1
          fi

          aria2c -x 16 -s 16 -j 8 -d "$CHUNK_DIR" -i /tmp/urls.txt

          cd "$CHUNK_DIR"
          ls part_*.tar | xargs -P 4 -I {} tar xf {}
          rm -f part_*.tar
          echo "Chunk files: $(ls | wc -l)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare public directory
        run: |
          mkdir -p public/data

      - name: Decompress chunks to public/data
        run: |
          cd "$GITHUB_WORKSPACE"
          for f in "$CHUNK_DIR"/*.zst; do
            base=$(basename "$f" .zst)
            zstd -d "$f" -o "public/data/$base"
            rm "$f"
          done
          echo "Decompressed files: $(ls public/data | wc -l)"

      - name: Deploy to PartyKit via split proxy
        env:
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_API_BASE: http://127.0.0.1:8787
        run: |
          PROXY_BATCH=500 PROXY_MAX_BATCH_BYTES=99614720 node scripts/api_proxy.js /tmp/proxy.log &
          PROXY_PID=$!
          sleep 2
          set +e
          bunx partykit deploy
          DEPLOY_STATUS=$?
          set -e
          kill $PROXY_PID 2>/dev/null || true
          wait $PROXY_PID 2>/dev/null || true
          echo "=== PROXY LOG ==="
          cat /tmp/proxy.log
          exit $DEPLOY_STATUS

      - name: Cleanup
        if: always()
        run: |
          rm -f "$MANIFEST_PATH"
          rm -rf "$PUBLIC_DIR" "$CHUNK_DIR"
